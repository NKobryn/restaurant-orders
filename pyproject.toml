[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-orders"
version = "0.3.0"
description = "Console application for restaurant order management"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
restaurant-orders = "restaurant_orders.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
