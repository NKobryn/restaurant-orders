[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-orders"
version = "1.0.0"
description = "Restaurant order management: REST API, SQLite database, analytics and optimization"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Кобрин Наталія-Володимира" }]
keywords = ["restaurant", "orders", "fastapi", "sqlalchemy", "rest-api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "types-PyYAML",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "build>=1.2",
]

[project.urls]
Repository = "https://github.com/NKobryn/restaurant-orders"

[project.scripts]
restaurant-orders = "restaurant_orders.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Starlette asks to switch TestClient to httpx2; the warning comes from the library, not from our code
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "integration: tests that combine several components (files, services, application flow)",
]

[tool.coverage.run]
source = ["restaurant_orders"]
branch = true
omit = [
    # scripts that only print demonstrations and experiment results
    "*/restaurant_orders/*/experiments.py",
    "*/restaurant_orders/stream/experiment.py",
    "*/restaurant_orders/benchmark.py",
    "*/restaurant_orders/domain/demo.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle errors, pyflakes and import sorting
select = ["E", "F", "I"]

[tool.mypy]
# the stubs of NumPy 2.5 (it needs Python >= 3.12) use Python 3.12 syntax
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
files = ["src", "benchmarks"]
